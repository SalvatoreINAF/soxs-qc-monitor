[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-monitor"
version = "1.0.0"
description = "QC monitoring tool for SOXS pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy==2.1.0",
    "pandas>=2.2.2,<3",
    "pyyaml==6.0.2",
    "astropy==6.1.2",
    "matplotlib",
]

[project.scripts]
qc-monitor = "qc_monitor.main:main"

[tool.setuptools]
packages = ["qc_monitor"]