[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-monitor"
version = "0.1.0"
description = "QC monitoring tool for SOXS pipeline"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.scripts]
qc-monitor = "qc_monitor.main:main"
