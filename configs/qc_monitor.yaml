paths:
  # Root folder containing SOXS pipeline reduction data
  upstream_root: /diska/home/pipeline/soxspipe_reductions/
  reduced_root: /diska/home/pipeline/soxspipe_reductions/reduced/

  # Historical QC database managed by this tool
  qc_database: /diska/home/pipeline/soxspipe_reductions/reduced/QC/qc.sqlite

acquisition:
  # Name of the upstream SOXS pipeline database inside each session folder
  upstream_database_name: soxspipe.db

  # Upstream table/view to read
  upstream_table: quality_control_plus_lite

  # Production-safe scanning policy.
  # direct: require upstream_root/soxspipe.db and ignore nested databases.
  # recursive: legacy mode; only use when multiple session DBs are intentional.
  upstream_database_search: direct
  allow_multiple_upstream_databases: false

  # observing_day_dirs: scan reduced_root/YYYY-MM-DD/ only.
  # recursive: legacy mode; scans everything below reduced_root.
  reduced_products_search: observing_day_dirs

  # Refuse likely test/scratch paths unless explicitly allowed.
  allow_suspicious_paths: false
  suspicious_path_tokens:
    - test
    - tmp
    - temporary
    - sandbox

plots:
  output_dir: /diska/home/pipeline/soxspipe_reductions/reduced/QC/plots
  html_output: /diska/home/pipeline/soxspipe_reductions/reduced/QC/index.html
  show: false

  # List of plot produce.
  # Each plot is defined in its own YAML file under the `plots/` folder
  # and is included here by name.
  include:
    - plots/datapoint_queries.yaml
    - plots/vis_bias.yaml
    - plots/vis_master_ron.yaml
    - plots/nir_dark.yaml
    - plots/nir_dark_ron.yaml
    - plots/vis_flat.yaml
    - plots/nir_flat.yaml
    - plots/dispersion_solution.yaml
    - plots/efficiency.yaml
    - plots/order_location.yaml
