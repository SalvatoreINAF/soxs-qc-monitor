paths:
  # QC root folder
  qc_root: /Users/savarese/Desktop/SOXS_Workspace/sessions/base/qc
  
  # QC database path
  database: data/qc.sqlite

# What recipes and metrics to look for during acquisition
acquisition:
  recipes:
    - soxs-mdark
    - soxs-disp-solution
  metrics:
    - MDARK MEDIAN
    - RON DETECTOR
  file_pattern_csv: "*_SOXS_QC.csv"
  file_pattern_disp_solution_fits: "*_SOXS_FITTED_LINES.fits"

# This field is used to filter complete recipes during processing
# that is: if a recipe already has all required metrics stored in the database,
# new data for that recipe will not be ingested again.
recipes:
  soxs-mdark:
    VIS:
      required_metrics:
        - MDARK MEDIAN
        - RON DETECTOR
    NIR:
      required_metrics:
        - MDARK MEDIAN
        - RON DETECTOR
  soxs-disp-solution:
    VIS:
      required_metrics:
        - DISP_RESIDUALS_MEAN
        - DISP_RESIDUALS_STD
        - DISP_FWHM_MEAN_ORDER_*
        - DISP_R_MEAN_ORDER_*
        - DISP_WAVELENGTH_MEAN_ORDER_*
    NIR:
      required_metrics:
        - DISP_RESIDUALS_MEAN
        - DISP_RESIDUALS_STD
        - DISP_FWHM_MEAN_ORDER_*
        - DISP_R_MEAN_ORDER_*
        - DISP_WAVELENGTH_MEAN_ORDER_*

# What metrics to plot
plots:
  output_dir: plots
  metrics:
    - MDARK MEDIAN
    - RON DETECTOR
    - DISP_RESIDUALS_MEAN
    - DISP_RESIDUALS_STD

