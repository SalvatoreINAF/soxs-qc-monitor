figures:

  - name: vis_dispersion_resolution
    type: dispersion_resolution
    title: Last VIS Dispersion Solution
    filename: vis_dispersion_resolution.png
    aspect: 0.01
    wide: true
    selection: latest
    arm: VIS

  - name: vis_dispersion_resolution_timeseries
    type: dispersion_resolution_timeseries
    title: VIS Dispersion Solution Mean Over Time
    filename: vis_dispersion_resolution_timeseries.png
    arm: VIS
    wide: true
    min_n_points: 2
    figsize: [16, 5]
    y_label: Mean resolution R
    legend_fontsize: 7
    legend_ncol: 4

  - name: nir_dispersion_resolution
    type: dispersion_resolution
    title: Last NIR Dispersion Solution
    filename: nir_dispersion_resolution.png
    aspect: 0.04
    wide: true
    selection: latest
    arm: NIR

  - name: nir_dispersion_resolution_timeseries
    type: dispersion_resolution_timeseries
    title: NIR Dispersion Solution Mean Over Time
    filename: nir_dispersion_resolution_timeseries.png
    arm: NIR
    wide: true
    min_n_points: 2
    figsize: [16, 5]
    y_label: Mean resolution R
    legend_fontsize: 6
    legend_ncol: 5

  - name: vis_dispersion_residual_xy
    type: dispersion_residual_xy
    title: VIS Dispersion Solution - Residual X vs Y
    filename: vis_dispersion_residual_xy.png
    selection: latest
    arm: VIS

  - name: nir_dispersion_residual_xy
    type: dispersion_residual_xy
    title: NIR Dispersion Solution - Residual X vs Y
    filename: nir_dispersion_residual_xy.png
    selection: latest
    arm: NIR

  - name: vis_dispersion_residual_xy_histogram
    type: dispersion_residual_histogram
    title: VIS Dispersion Solution - Residual XY Histogram
    filename: vis_dispersion_residual_xy_histogram.png
    selection: latest
    arm: VIS
    bins: 40
    figsize: [7, 7.2]

  - name: nir_dispersion_residual_xy_histogram
    type: dispersion_residual_histogram
    title: NIR Dispersion Solution - Residual XY Histogram
    filename: nir_dispersion_residual_xy_histogram.png
    selection: latest
    arm: NIR
    bins: 40
    figsize: [7, 7.2]