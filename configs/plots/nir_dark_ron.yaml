figures:

  - name: nir_dark_ron
    type: time_series
    title: NIR Dark RON
    filename: nir_dark_ron.png
    time_range: last_3_months
    y_label: electrons
    
    series:
      - label: 2 s
        style: markers
        filters: &nir_ron_2s
          soxspipe_recipe: soxs-mdark
          qc_name: RAW RON
          eso seq arm: NIR
          exptime: 2.0
          rospeed: "3"
